study_name: mflickr_dino_baseline_shc_bs32

# Phase 1, baseline 2/3 : SHC (Chen et al., ACM TOIS 2025) sur DINOv2 nu.
#
# Meme loss que CSQ -- leur etage 3 est litteralement 'class CSQLoss' -- seuls
# les centres changent. Produire le fichier AVANT de lancer :
#
#   python -m studies.generate_shc_centers \
#       --dataset MIRFlickrHashing --data_dir <chemin> \
#       --num_classes 38 --bits 64 --backbone resnet34 \
#       --classifier_epochs 50 --out data/shc_centers_mflickr_64.pt
#
# A VERIFIER au demarrage : la ligne [CenterHashLoss] doit montrer des distances
# de Hamming qui VARIENT (min != max). Si min == moyenne == max, l'etage 2 de SHC
# a degenere et a renvoye son initialisation CSQ -- ce serait alors du Hadamard
# deguise, et cette etude ferait doublon avec celle de CSQ.
base_overrides:
  loss: center_hash
  loss.0.kwargs.centers: data/shc_centers_mflickr_64.pt
  optimizer: basic
  model: dino_hashing            # DINOv2 ViT-S/14
  transform: basic
  dataset: mflickr

  dataset.sampler.kwargs.batch_size: 32
  model.kwargs.binary_config.nbits: 64
  model.kwargs.dino_backbone: dinov2_vits14
  model.kwargs.embed_dim: 384
  model.kwargs.with_autocast: true

  experience.max_iter: 50
  experience.train_eval_freq: 5
  experience.test_eval_freq: 5
  experience.fast_eval_freq: -1
  experience.evaluation.top_k: 19581
  experience.evaluation.distance_metric: hamming

  experience.save_model: 10
  experience.num_workers: 8
  experience.eval_bs: 200
  experience.sub_batch: 32
  experience.batch_map_proxy: false
  experience.hooks_configs.active: false
  # OBLIGATOIRE : config/experience/default.yaml met dsch_train a True par defaut,
  # ce qui detourne run.py vers la boucle autonome des auteurs de DSCH
  # (engine/DSCH/train.py) et court-circuite tout ce pipeline.
  experience.dsch_train: false
  experience.log_dir: ./experiments_runs
  experience.csv_log_dir: ./csv_metrics

# Une seule graine : le budget temps ne permet pas trois repetitions par
# baseline. Consequence a assumer dans le papier -- sans variance
# inter-graines, un ecart entre methodes ne peut pas etre qualifie de
# significatif. A relancer sur 3 graines si le calendrier le permet.
sweep_zip:
  experience.seed: [333]
