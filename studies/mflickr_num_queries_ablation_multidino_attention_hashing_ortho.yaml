study_name: mflickr_num_queries_ablation

# MIRFLICKR counterpart of voc_num_queries_ablation. Sensitivity study on
# model.kwargs.fusion_config.num_queries -- Reviewer #2's request ("no
# sensitivity study on the number of subbands ... these are central
# hyperparameters"). Note: num_queries is decoupled from the number of
# subbands (always 4, fixed by the SWT decomposition) -- it's the number of
# learnable query tokens in the fusion bottleneck. Everything under
# loss/model/optimizer/transform is pinned to the reference MIRFLICKR config
# (mflickr_lph_vs_ortho_multiseed) exactly.
base_overrides:
  # Config groups
  optimizer: basic
  model: multidino_attention_hashing_ortho
  transform: basic_swt
  dataset: mflickr
  loss: hash_loss

  dataset.kwargs.data_dir: /content/data/mirflickr

  # --- Protected: must match the reference config exactly, fixed across the whole sweep ---
  dataset.sampler.kwargs.batch_size: 96
  loss.0.kwargs.num_classes: 38
  loss.0.kwargs.embedding_size: 64
  loss.0.kwargs.quant_weight: 0.1               # lambda1
  loss.0.kwargs.scale: 15.0
  model.kwargs.binary_config.nbits: 64
  model.kwargs.use_bn: true
  model.kwargs.fusion_config.use_all_tokens: false
  model.kwargs.fusion_config.sub_band_dropout_p: 0
  model.kwargs.fusion_config.ortho_weight: 0.1  # lambda2
  model.kwargs.with_autocast: false
  experience.seed: 333
  experience.max_iter: 50
  experience.train_eval_freq: -1              # never used for best_score/principal_metric (eval_split=test) -- pure overhead
  experience.test_eval_freq: 50                # = max_iter: full top_k=19581 eval only at the final epoch
  experience.fast_eval_freq: 5                  # cheap progress curve on a small subset instead
  experience.fast_eval_size: 500
  experience.save_model: 5
  experience.clip_grad: 5.0
  experience.evaluation.top_k: 19581
  experience.evaluation.distance_metric: hamming

  # --- Flexible: pure engineering/compute knobs, don't affect the trained model ---
  experience.num_workers: 10
  experience.eval_bs: 200
  experience.sub_batch: 48
  experience.batch_map_proxy: false
  experience.hooks_configs.active: false
  experience.dsch_train: false
  experience.log_dir: ./experiments_runs

# Single seed per N (matches the reference's seed=333) -- this is a sweep, not
# a headline claim, so no multi-seed repetition here.
# num_queries=4 is DELIBERATELY excluded: at ortho_weight=0.1, seed=333, every
# other override matches mflickr_lph_vs_ortho_multiseed's base_overrides
# exactly (fusion_config.type defaults to cross_attention_advanced in both).
# sub_batch differs (48 here vs 96 there) but is a pure memory/gradient-
# accumulation knob (main/engine/base_update.py's _split_into_microbatches)
# that doesn't change the trained model. Reuse the existing checkpoint instead
# of retraining:
#   experiments_runs/mflickr_lph_vs_ortho_multiseed_*ortho_weight=0.1*seed=333*/
sweep:
  model.kwargs.fusion_config.num_queries: [1, 2, 8]
