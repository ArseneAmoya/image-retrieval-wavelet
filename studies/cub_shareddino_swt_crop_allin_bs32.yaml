study_name: cub_shareddino_swt_crop_allin_roadmap_lora_bs32_r64mlp_unfreeze2

# 26 sept. 2026 -- serie « tout pour le tout » sur la fusion / le routage.
# Tout combine : routes en debut (0, 1) + attention jointe en fin (10, 11) + fusion ancree sur LL sur patch tokens. Tete a lr 1e-4.
# Base commune : config #37 (crop seul, rank 64 / attn_mlp / 2 blocs degeles,
# 100 epochs, evaluation finale seule), sans prompts ni DSLN.
# References : fusion self-attention + GeM 77.08 ; RetrievalNet #38 77.35.
base_overrides:
  loss: roadmap
  optimizer: lora_100ep_fusion1e4
  model: shareddino_swt_routed
  transform: cub_swt_crop
  dataset: cub_indomain

  dataset.sampler.kwargs.batch_size: 32
  model.kwargs.with_autocast: true
  model.kwargs.routing_config.band_specific_blocks: [0, 1]
  model.kwargs.routing_config.joint_band_blocks: [10, 11]
  model.kwargs.fusion_config.type: ll_anchored
  model.kwargs.fusion_config.kv_source: patches

  experience.max_iter: 100
  # Evaluation finale seule (convention du 24 sept.) -- ne pas mettre -1.
  experience.train_eval_freq: 1000
  experience.test_eval_freq: 1000
  experience.fast_eval_freq: -1
  experience.evaluation.top_k: 2048
  experience.evaluation.distance_metric: l2
  experience.principal_metric: mean_average_precision_at_r_level0

  experience.save_model: 10
  # 10 workers (12 vCPU sur le L4 Colab) : l augmentation change de toute
  # facon, la comparabilite de tirage avec #46 est deja perdue.
  experience.num_workers: 10
  experience.eval_bs: 500
  experience.sub_batch: 128
  experience.clip_grad: null
  experience.batch_map_proxy: false
  experience.hooks_configs.active: false
  experience.dsch_train: false
  experience.log_dir: ./experiments_runs
  experience.csv_log_dir: ./csv_metrics

sweep_zip:
  experience.seed: [333]
