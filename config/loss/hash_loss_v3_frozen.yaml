- name: HashLossV3
  weight: 1.0
  kwargs:
    num_classes: 20       # 20 classes pour PASCAL VOC
    embedding_size: 64
        # Sera écrasé en ligne de commande pour 16 et 32 bits
    scale: 2.0
    # 0.0 by default project-wide since ablation #5 on HashLossV2 (mflickr,
    # scale=15) found proxy_polarization neither prevents/delays proxy fusion
    # nor changes any retrieval/training metric -- see
    # claude/hash-loss-v1-vs-v2-mflickr-results.md. Doesn't affect this frozen
    # variant's proxies anyway (freeze_centers=true -> requires_grad=False),
    # kept for consistency with hash_loss_v3_trainable.yaml.
    proxy_polarization_weight: 0.0

    freeze_centers: true   # hybrid init, centers fixed at init (compare vs hash_loss_v3_trainable.yaml)

    # Produced once by: python -m scripts.compute_class_cooccurrence
    #   --dataset VOC2012Hashing --data_dir <same as config/dataset/voc.yaml> \
    #   --mode train --out data/voc_train_label_matrix.npy
    label_matrix_path: data/voc_train_label_matrix.npy
    semantic_embeddings_path: null   # not wired up yet — leave null for now
    alpha: 0.5
    init_seed: 42
    log_proxy_diagnostics: false   # set true to also log diag_* proxy/embedding diagnostics + a per-epoch raw proxy snapshot (main/engine/proxy_logger.py) -- now wired up for HashLossV3 too

    # No optimizer block needed: freeze_centers=true means no trainable
    # parameters, so HashLossV3 never builds a loss_optimizer.
