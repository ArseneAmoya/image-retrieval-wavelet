- name: HashLossV2Quant
  weight: 1.0
  kwargs:
    num_classes: 38       # overridden per-dataset in study base_overrides (38 for MIRFLICKR, 20 for VOC)
    embedding_size: 64
        # Sera écrasé en ligne de commande pour 16/32/128 bits
    scale: 2.0
    # 0.0 since ablation #5, see claude/hash-loss-v1-vs-v2-mflickr-results.md
    # and config/loss/hash_loss_v2.yaml's comment -- same result applies here.
    proxy_polarization_weight: 0.0
    quant_weight: 0.1     # same value as HashLoss V1's quant_weight -- directly comparable
    log_proxy_diagnostics: false   # set true to also log diag_* proxy/embedding diagnostics + a per-epoch raw proxy snapshot (main/engine/proxy_logger.py)

    optimizer:
      name: AdamW
      kwargs:
        lr: 0.0001
        weight_decay: 0.0001
