# @package _group_
# Backbone-grid baseline: DINOv2 ViT-S/14 (~21M) + hashing head.
# Same class and output contract as baseline_vitb_hash / baseline_r50_hash, so the
# three differ only by backbone. Raw logits in training (HashLoss applies the tanh;
# SCHLoss needs apply_tanh: true).
name: DINOHashBaseline
freeze_batch_norm: false
freeze_pos_embedding: false
kwargs:
  dino_backbone: 'dinov2_vits14'
  embed_dim: 384
  binary_config:
    nbits: 64
  with_autocast: false
