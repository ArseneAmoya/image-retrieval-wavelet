# @package _group_
#
# 26 sept. 2026 -- identique a shareddino_swt_continuous.yaml (SharedDinoRetrieval,
# LoRA rank 64 / attn_mlp / 2 blocks degeles) SAUF la fusion : SemanticFusionHead
# (requete = CLS de LL, cross-attention sur les 4 bandes) AVEC residual : le CLS
# de LL est ajoute a la sortie de l'attention (norm1(LL + attn)), ce qui lui donne
# un chemin direct jusqu'a la sortie. LL sert de base, les bandes HF de correction.
name: SharedDinoRetrieval
freeze_batch_norm: false
freeze_pos_embedding: false
kwargs:
  backbone_config:
    name: 'dinov2_vits14'
    frozen: false
    # LayerNorm par sous-bande (MultiDomainLayerNorm), false par defaut.
    # Cle declaree ici pour pouvoir la surcharger en CLI (Hydra struct mode).
    use_dsln: false
  fusion_config:
    type: 'semantic'
    output_dim: 384
    num_heads: 8
    dropout: 0.1
    residual: true
  with_autocast: true
  lora_config:
    enabled: true
    rank: 64
    scope: attn_mlp
    dropout: 0.05
    unfreeze_last_n_blocks: 2
