# @package _group_
# Backbone-grid baseline: ResNet50 (~25M) + hashing head.
# Uses ResNetHashBaseline (main/models/resnet_hash_baseline.py), NOT the older
# resnet_hashing.yaml / resnet50_tanh path, which double-squashes and normalizes --
# see that class's docstring. Output contract identical to the two DINO arms.
name: ResNetHashBaseline
freeze_batch_norm: false
freeze_pos_embedding: false
kwargs:
  backbone_name: 'resnet50'
  embed_dim: 2048
  pretrained: true
  use_bn: true
  binary_config:
    nbits: 64
  # Required: run.py reads config.model.kwargs.with_autocast unconditionally to
  # decide whether to build a GradScaler. false matches the two DINO baselines,
  # so the three arms train in the same precision regime.
  with_autocast: false
