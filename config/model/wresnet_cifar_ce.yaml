# @package _group_
name: RetrievalNet
freeze_batch_norm: False
freeze_pos_embedding: False
kwargs:
  backbone_name: wresnet_ce
  embed_dim: 512
  norm_features: False
  without_fc: True
  with_autocast: True
  attention: False
  decom_level: 1
  wave: haar
  feature_size: 512
  attention_type: eca
  num_classes: 100
  proj_dim: null                 # null = legacy: embedding = fused backbone feature (no projection)
  normalize_embeddings: False    # False = legacy (July 2025): raw embedding at eval
