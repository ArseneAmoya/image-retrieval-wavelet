# @package _group_
name: MultiDinoHashing
freeze_batch_norm: false
freeze_pos_embedding: false
kwargs:
  # Liste de vos 4 branches (Ondelettes : LL, LH, HL, HH)
  backbones_config:
    - name: 'dinov2_vits14'
      frozen: False  # On gèle DINO pour laisser l'attention apprendre en premier
    - name: 'dinov2_vits14'
      frozen: False
    - name: 'dinov2_vits14'
      frozen: False
    - name: 'dinov2_vits14'
      frozen: False

  # Configuration du Hachage
  binary_config:
    nbits: 64  # Doit être identique à la Baseline pour comparer équitablement !

  use_bn: True

  # Configuration du Goulot d'Étranglement (SOTA)
  fusion_config:
    use_all_tokens: False
    type: 'cross_attention_advanced' # Active notre nouvelle classe
    output_dim: 384                    # Dimension latente
    num_heads: 8                       # Multi-têtes pour des relations complexes
    dropout: 0.1
    # -- Nouveaux paramètres SOTA (Hybrid Regularization) --
    # num_queries default changed 4 -> 1 (2026-08-17): the "4 experts to separate the 4
    # subbands" motivation is unsupported (attention never specializes by band, see
    # RESULTS.md section 2/4b) and the sensitivity study (RESULTS.md section 5c) found
    # N=1/4/8 statistically indistinguishable at sub_batch=96 (spread 0.0015, inside the
    # measured same-seed noise floor). N=1 is kept as the new default because it's the
    # cheapest: out_proj is Linear(384,384) instead of Linear(1536,384) at N=4. Not
    # presented as a contribution -- see RESULTS.md section 5c's explicit scope decision.
    num_queries: 1
    sub_band_dropout_p: 0            # Force le réseau à explorer LH, HL, HH
    ortho_weight: 0.01                  # Force la division du travail (sans exploser la loss)

  with_autocast: true