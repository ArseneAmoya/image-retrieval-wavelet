# @package _group_
#
# LoRA sur DINOv2 nu en mode CONTINU (RetrievalNet, pas DINOHashBaseline) --
# backbone gele + adaptateurs bas-rang injectes dans les Linear qkv/proj
# (+ mlp.fc1/fc2 selon scope), cf. main/models/lora_utils.py. Comparable
# point par point a config/model/dino.yaml (baseline continue full
# fine-tune), seule difference : lora_config.
#
# Necessite le support LoRA ajoute a RetrievalNet.__init__ (main/models/net.py)
# le 22 sept. 2026 : get_backbone()/RetrievalNet n'avait jusque-la aucun
# mecanisme LoRA (contrairement a DINOHashBaseline, qui l'avait deja) --
# un lora_config passe ici sans ce changement de code aurait ete
# silencieusement avale par **kwargs et n'aurait eu aucun effet. Meme
# fonction inject_lora() reutilisee telle quelle (main/models/lora_utils.py),
# meme garde-fou d'exclusion mutuelle avec frozen=True.
#
# rank et scope sont les deux axes du sweep (voir les etudes
# cub_dino_roadmap_*_lora_bs32.yaml, sweep cartesien rank x scope).
# alpha n'est PAS renseigne ici : inject_lora() utilise alpha = 2*rank par
# defaut quand lora_config.alpha est absent, pour garder un scaling
# alpha/rank constant (=2) a travers le sweep de rank.
#
# unfreeze_last_n_blocks (nouveau, 23 sept. 2026) : 2e axe, additif a LoRA
# -- dégèle entièrement (poids de base compris, pas seulement le delta LoRA)
# les N derniers blocks du backbone, cf. main/models/lora_utils.py::
# unfreeze_last_n_blocks (appele juste apres inject_lora dans
# RetrievalNet.__init__). 0 = desactive (comportement LoRA seul, inchange
# pour toutes les etudes existantes qui ne le renseignent pas). Pas de
# changement d'optimizer necessaire : ces parametres nouvellement degeles ne
# contiennent pas 'lora_' dans leur nom, ils tombent donc dans le groupe de
# base (lr=1e-5, meme lr que hash_head/fc) plutot que dans le groupe boost
# LoRA (lr=1e-4) -- coherent avec le fait que ce sont de vrais poids
# pretraines, pas un adaptateur initialise a zero.
name: RetrievalNet
freeze_batch_norm: False
freeze_pos_embedding: False
kwargs:
  backbone_name: dino
  dino_backbone: 'dinov2_vits14'
  embed_dim: 384
  norm_features: False
  without_fc: True
  with_autocast: True
  pretrained: True
  lora_config:
    enabled: true
    rank: 8            # swept: 4, 8, 16
    scope: attn_only    # swept: attn_only, attn_mlp
    dropout: 0.05
    unfreeze_last_n_blocks: 0   # swept in cub_dino_roadmap_basic_100ep_r16mlp_unfreeze_bs32.yaml
