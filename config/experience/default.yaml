# @package _group_
experiment_name: ???
log_dir: .
# Per-epoch training-loss / eval-metric CSVs (main/engine/csv_logger.py), one
# pair of files per experiment_name, kept separate from log_dir's checkpoints
# and Hydra logs. Override per-study if you want them elsewhere.
csv_log_dir: ./csv_metrics
seed: 333
resume: null
maybe_resume: False
force_lr: null

warm_up: -1
warm_up_key: fc

max_iter: 50
step_per_epoch: 1000

train_eval_freq: 5
val_eval_freq: -1
test_eval_freq: 5
batch_map_proxy: False
fast_eval_freq: -1
fast_eval_size: 500
eval_bs: 1000
save_model: 10
eval_split: test
# maphashing_level0 (calculate_maphashing / calc_hamming_dist in accuracy_calculator.py) is
# true binary-Hamming-distance mAP, distinct from the generic KNN-graph-based `map` family.
# eval_split stays "test": MIRFlickrHashing maps mode='val' to the SAME test.txt as mode='test'
# (main/datasets/flikr_coco.py), and run.py never builds a val_dts for these studies (split is
# unset here), so there is no distinct held-out val data in this pipeline -- "val" == "test".
principal_metric: maphashing_level0
log_grad: False
with_AP: True
landmarks: False

split: null
kfold: null
split_random_state: null
with_super_labels: False

num_workers: 4
pin_memory: True

sub_batch: 128
update_type: base_update
clip_grad: null
evaluation:
  top_k: 5000
  distance_metric: "hamming"
hooks_configs:
  active: True
dsch_train: True