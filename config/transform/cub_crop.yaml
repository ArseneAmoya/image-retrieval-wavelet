# @package _group_
#
# 24 sept. 2026 : controle RGB de cub_swt_crop.yaml, pour RetrievalNet.
# Meme augmentation que cub_swt_crop (Resize 256 -> RandomCrop 224 -> flip,
# sans RandomResizedCrop ni ColorJitter), terminee comme cub.yaml par
# ToTensor + Normalize ImageNet. Test identique a cub.yaml. Permet de
# comparer shareddino et RetrievalNet a augmentation identique.
train:
  Resize:
    size: 256
  RandomCrop:
    size: 224
  RandomHorizontalFlip:
    p: 0.5
  ToTensor: {}
  Normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

test:
  Resize:
    size: 256
  CenterCrop:
    size: 224
  ToTensor: {}
  Normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
