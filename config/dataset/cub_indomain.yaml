# @package _group_
name: Cub200Indomain
kwargs:
  # Chemin absolu vers le dossier CUB_200_2011 (celui qui contient directement
  # 'images/', 'classes.txt', etc.) sur l'instance Colab -- PAS un chemin relatif :
  # le run original (cub_dino_384d, 5 avril 2026, cf. .hydra/overrides.yaml sur le
  # Drive) l'a toujours passe en override CLI absolu (/content/CUB_200_2011), jamais
  # via ce yaml. L'ancienne valeur ici ('../../data/cub200', relative) etait de toute
  # facon fausse : hydra.run.dir = ${experience.log_dir}/${experience.experiment_name}/outputs
  # place le cwd d'execution 3 niveaux sous la racine du repo, pas 2 -- '../../'
  # remontait seulement jusqu'a experiments_runs/, jamais jusqu'a la racine.
  # 22 sept. 2026 (Arsene) : le dataset est extrait sous /content/data/cub/CUB_200_2011
  # sur cette instance Colab (pas /content/CUB_200_2011 comme le run d'origine).
  data_dir: /content/data/cub/CUB_200_2011
  seed: 42 # Pour garantir que le split Train/Query/Gallery reste fixe

sampler:
  name: MPerClassSampler # Recommandé pour le Retrieval (vs RandomSampler pour CUB)
  kwargs:
    batch_size: 96
    samples_per_class: 4 # Important pour les pertes type Triplet/Contrastive
    # Cela signifie qu'un batch de 128 aura 32 classes différentes avec 4 images chacune.

# Informations pour le modèle (nombre de classes total dans CIFAR-100)
num_classes: 200